[General]
# iSubdivisions (0-3) sets how many times each 128-unit landscape quad is split in half per axis.
# Every original LAND vertex stays exactly where it was; the new vertices in between follow a
# smooth curve (Catmull-Rom spline) fitted through the original vertices, so the sharp creases
# of the vanilla mesh disappear.
#   0 = vanilla mesh (the plugin installs no hooks)
#   1 = 33x33 verts per quadrant (4x vanilla triangles)
#   2 = 65x65 verts per quadrant (16x vanilla triangles)
#   3 = 129x129 verts per quadrant (64x vanilla triangles)
# Higher levels cost a bit of GPU performance
iSubdivisions=2
# fSmoothness (0.0-1.0) scales how strongly the curve is applied.
#   1.0 = the full fitted curve (recommended)
#   0.0 = new vertices stay on the flat vanilla surface (no visual change)
fSmoothness=1.0
# fMaxRise (world units) caps how far the curve may swing up past the original vertices it runs
# through. Raise it for rounder crests, lower it if terrain pokes through a static mesh.
#   0.0 = no new vertex rises above the highest original vertex around it
#   large = the unrestrained curve (dips are never capped either way)
fMaxRise=20.0
# iSmoothedGrids limits the smoothing to a square of grids (cells) centered on the player.
# The value is a radius that counts the player's own grid: 2 means the grid the player stands
# in plus all of its neighbors (a 3x3 square, 9 grids), 3 means a 5x5 square, and so on.
#   0 = no distance limit; every loaded grid is smoothed as it is built
#   2 = the player's grid plus its neighbor ring, 3x3 (default, minimum)
#   3, 4, ... = wider squares (5x5, 7x7, ...); capped at the game's uGridsToLoad, since grids
#               beyond the loaded area have no terrain mesh to smooth
iSmoothedGrids=2
